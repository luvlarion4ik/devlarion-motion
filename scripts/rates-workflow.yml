name: CBR rates
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 16:30 МСК, после публикации курсов ЦБ на следующий день
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-rates.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet docs/assets/rates.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update CBR exchange rates"
          git push
